<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="805" viewBox="0 0 1240 805" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>aws-vpc-network-foundation architecture</title>
  <desc>GitHub Actions deploys a VPC with public, private, and isolated subnets in two availability zones, using OIDC and Terraform state in S3 with a lock file.</desc>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#444441" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#BA7517" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect width="1240" height="805" fill="#FFFFFF"/>

  <text x="20" y="32" font-size="18" font-weight="600" fill="#2C2C2A">aws-vpc-network-foundation: deploy flow and network</text>
  <text x="20" y="52" font-size="12" fill="#5F5E5A">Day 1, ap-south-1. The VPC was destroyed after the test. Bootstrap resources remain.</text>

  <!-- Internet -->
  <rect x="905" y="55" width="160" height="40" rx="20" fill="#FFFFFF" stroke="#5F5E5A"/>
  <text x="985" y="80" font-size="13" text-anchor="middle" fill="#2C2C2A">Internet</text>

  <!-- Developer -->
  <rect x="30" y="140" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#5F5E5A"/>
  <text x="150" y="163" font-size="13" font-weight="600" text-anchor="middle" fill="#2C2C2A">Developer laptop</text>
  <text x="150" y="182" font-size="11" text-anchor="middle" fill="#5F5E5A">AWS SSO profile homestead</text>

  <!-- GitHub -->
  <rect x="20" y="235" width="250" height="220" rx="12" fill="#F1EFE8" stroke="#888780" stroke-dasharray="6 4"/>
  <text x="34" y="256" font-size="13" font-weight="600" fill="#444441">GitHub</text>
  <rect x="33" y="275" width="224" height="56" rx="8" fill="#FFFFFF" stroke="#5F5E5A"/>
  <text x="145" y="297" font-size="13" font-weight="600" text-anchor="middle" fill="#2C2C2A">Repository</text>
  <text x="145" y="316" font-size="11" text-anchor="middle" fill="#5F5E5A">veerbal1/aws-vpc-network-foundation</text>
  <rect x="33" y="380" width="224" height="56" rx="8" fill="#FFFFFF" stroke="#5F5E5A"/>
  <text x="145" y="402" font-size="13" font-weight="600" text-anchor="middle" fill="#2C2C2A">GitHub Actions</text>
  <text x="145" y="421" font-size="11" text-anchor="middle" fill="#5F5E5A">deploy.yml: plan + apply</text>

  <!-- Legend -->
  <rect x="20" y="490" width="220" height="290" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="34" y="512" font-size="13" font-weight="600" fill="#2C2C2A">Deploy flow</text>
  <text x="34" y="532" font-size="11" fill="#444441">1. Push to infra/ runs deploy.yml</text>
  <text x="34" y="548" font-size="11" fill="#444441">2. GitHub signs an OIDC token</text>
  <text x="34" y="564" font-size="11" fill="#444441">3. AWS matches sub to the role</text>
  <text x="34" y="580" font-size="11" fill="#444441">4. Role gives 1 h credentials</text>
  <text x="34" y="596" font-size="11" fill="#444441">5. Terraform locks state in S3</text>
  <text x="34" y="612" font-size="11" fill="#444441">6. Apply builds 20 resources</text>
  <text x="34" y="646" font-size="13" font-weight="600" fill="#2C2C2A">Subnet tiers</text>
  <rect x="34" y="658" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="56" y="669" font-size="11" fill="#444441">Public: to internet gateway</text>
  <rect x="34" y="682" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="56" y="693" font-size="11" fill="#444441">Private: out only via NAT</text>
  <rect x="34" y="706" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D"/>
  <text x="56" y="717" font-size="11" fill="#444441">Isolated: no internet route</text>
  <line x1="34" y1="741" x2="48" y2="741" stroke="#BA7517" stroke-width="2"/>
  <text x="56" y="745" font-size="11" fill="#444441">Outbound through NAT</text>
  <line x1="34" y1="763" x2="48" y2="763" stroke="#888780" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="56" y="767" font-size="11" fill="#444441">Local route inside the VPC</text>

  <!-- AWS account -->
  <rect x="380" y="115" width="840" height="670" rx="16" fill="#FAFAF7" stroke="#888780" stroke-dasharray="6 4"/>
  <text x="395" y="137" font-size="13" font-weight="600" fill="#444441">AWS account 767397707624</text>

  <!-- Bootstrap -->
  <rect x="400" y="155" width="280" height="410" rx="12" fill="#F1EFE8" stroke="#888780"/>
  <text x="414" y="176" font-size="13" font-weight="600" fill="#444441">bootstrap/ (local state)</text>
  <rect x="418" y="190" width="244" height="56" rx="8" fill="#FFFFFF" stroke="#5F5E5A"/>
  <text x="540" y="212" font-size="13" font-weight="600" text-anchor="middle" fill="#2C2C2A">OIDC provider</text>
  <text x="540" y="231" font-size="11" text-anchor="middle" fill="#5F5E5A">token.actions.githubusercontent.com</text>
  <rect x="418" y="275" width="244" height="56" rx="8" fill="#FFFFFF" stroke="#5F5E5A"/>
  <text x="540" y="297" font-size="13" font-weight="600" text-anchor="middle" fill="#2C2C2A">IAM role for CI</text>
  <text x="540" y="316" font-size="11" text-anchor="middle" fill="#5F5E5A">github-actions-network-foundation</text>
  <rect x="418" y="350" width="244" height="200" rx="10" fill="#FFFFFF" stroke="#5F5E5A"/>
  <text x="540" y="372" font-size="13" font-weight="600" text-anchor="middle" fill="#2C2C2A">S3 state bucket</text>
  <text x="540" y="389" font-size="11" text-anchor="middle" fill="#5F5E5A">versioning, KMS, no public access</text>
  <rect x="430" y="400" width="220" height="50" rx="6" fill="#F1EFE8" stroke="#888780"/>
  <text x="540" y="421" font-size="13" text-anchor="middle" fill="#2C2C2A">terraform.tfstate</text>
  <text x="540" y="439" font-size="11" text-anchor="middle" fill="#5F5E5A">key network-foundation/</text>
  <rect x="430" y="465" width="220" height="50" rx="6" fill="#F1EFE8" stroke="#888780"/>
  <text x="540" y="486" font-size="13" text-anchor="middle" fill="#2C2C2A">terraform.tfstate.tflock</text>
  <text x="540" y="504" font-size="11" text-anchor="middle" fill="#5F5E5A">use_lockfile = true</text>

  <rect x="418" y="600" width="244" height="50" rx="8" fill="#FFFFFF" stroke="#5F5E5A"/>
  <text x="540" y="630" font-size="13" text-anchor="middle" fill="#2C2C2A">Amazon S3 service</text>

  <!-- VPC -->
  <rect x="700" y="155" width="505" height="610" rx="14" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="714" y="176" font-size="13" font-weight="600" fill="#085041">VPC 10.42.0.0/16</text>
  <rect x="905" y="175" width="160" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5"/>
  <text x="985" y="200" font-size="13" text-anchor="middle" fill="#0C447C">Internet gateway</text>

  <rect x="712" y="235" width="238" height="440" rx="10" fill="#FFFFFF" stroke="#888780" stroke-dasharray="5 4"/>
  <text x="724" y="253" font-size="12" fill="#5F5E5A">ap-south-1a</text>
  <rect x="958" y="235" width="238" height="440" rx="10" fill="#FFFFFF" stroke="#888780" stroke-dasharray="5 4"/>
  <text x="970" y="253" font-size="12" fill="#5F5E5A">ap-south-1b</text>

  <rect x="722" y="265" width="218" height="130" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="831" y="285" font-size="13" font-weight="600" text-anchor="middle" fill="#0C447C">public-a</text>
  <text x="831" y="302" font-size="11" text-anchor="middle" fill="#185FA5">10.42.0.0/24</text>
  <rect x="734" y="315" width="194" height="60" rx="6" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="831" y="339" font-size="13" font-weight="600" text-anchor="middle" fill="#633806">NAT gateway + EIP</text>
  <text x="831" y="358" font-size="11" text-anchor="middle" fill="#854F0B">$44.53 per month</text>

  <rect x="968" y="265" width="218" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="1077" y="288" font-size="13" font-weight="600" text-anchor="middle" fill="#0C447C">public-b</text>
  <text x="1077" y="307" font-size="11" text-anchor="middle" fill="#185FA5">10.42.1.0/24</text>

  <rect x="722" y="425" width="218" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="831" y="448" font-size="13" font-weight="600" text-anchor="middle" fill="#3C3489">private-a</text>
  <text x="831" y="467" font-size="11" text-anchor="middle" fill="#534AB7">10.42.16.0/20, apps</text>
  <rect x="968" y="425" width="218" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="1077" y="448" font-size="13" font-weight="600" text-anchor="middle" fill="#3C3489">private-b</text>
  <text x="1077" y="467" font-size="11" text-anchor="middle" fill="#534AB7">10.42.32.0/20, apps</text>

  <rect x="722" y="545" width="218" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
  <text x="831" y="568" font-size="13" font-weight="600" text-anchor="middle" fill="#712B13">isolated-a</text>
  <text x="831" y="587" font-size="11" text-anchor="middle" fill="#993C1D">10.42.64.0/24, databases</text>
  <rect x="968" y="545" width="218" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
  <text x="1077" y="568" font-size="13" font-weight="600" text-anchor="middle" fill="#712B13">isolated-b</text>
  <text x="1077" y="587" font-size="11" text-anchor="middle" fill="#993C1D">10.42.65.0/24, databases</text>

  <rect x="800" y="695" width="300" height="50" rx="8" fill="#FFFFFF" stroke="#0F6E56"/>
  <text x="950" y="716" font-size="13" font-weight="600" text-anchor="middle" fill="#085041">S3 gateway endpoint</text>
  <text x="950" y="734" font-size="11" text-anchor="middle" fill="#0F6E56">on all 3 route tables, $0</text>

  <!-- Deploy arrows -->
  <path d="M145 196 L145 273" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#ad)"/>
  <text x="153" y="222" font-size="11" fill="#444441">git push</text>
  <path d="M145 331 L145 378" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#ad)"/>
  <text x="153" y="360" font-size="11" fill="#444441">1. push to infra/**</text>
  <path d="M270 168 L398 168" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#ad)"/>
  <text x="334" y="160" font-size="11" text-anchor="middle" fill="#444441">apply once</text>
  <path d="M259 395 L345 395 L345 218 L416 218" fill="none" stroke="#444441" stroke-width="1.4" marker-start="url(#ad)" marker-end="url(#ad)"/>
  <text x="339" y="300" font-size="11" text-anchor="end" fill="#444441">2. token</text>
  <text x="339" y="316" font-size="11" text-anchor="end" fill="#444441">4. creds</text>
  <text x="339" y="330" font-size="11" text-anchor="end" fill="#444441">(1 hour)</text>
  <path d="M540 248 L540 273" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#ad)"/>
  <text x="548" y="265" font-size="11" fill="#444441">3. sub matches IDs</text>
  <path d="M259 425 L428 425" fill="none" stroke="#444441" stroke-width="1.4" marker-start="url(#ad)" marker-end="url(#ad)"/>
  <text x="339" y="418" font-size="11" text-anchor="end" fill="#444441">5. state</text>
  <path d="M250 438 L250 760 L698 760" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#ad)"/>
  <text x="500" y="752" font-size="12" text-anchor="middle" fill="#444441">6. terraform apply (20 resources)</text>

  <!-- Network arrows -->
  <path d="M985 97 L985 173" fill="none" stroke="#185FA5" stroke-width="1.4" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <path d="M903 195 L831 195 L831 263" fill="none" stroke="#185FA5" stroke-width="1.4" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <path d="M1067 195 L1077 195 L1077 263" fill="none" stroke="#185FA5" stroke-width="1.4" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <path d="M831 423 L831 377" fill="none" stroke="#BA7517" stroke-width="1.6" marker-end="url(#aa)"/>
  <text x="839" y="412" font-size="11" fill="#854F0B">out only</text>
  <path d="M1077 423 L1077 408 L945 408 L945 345 L930 345" fill="none" stroke="#BA7517" stroke-width="1.6" marker-end="url(#aa)"/>
  <text x="1011" y="402" font-size="11" text-anchor="middle" fill="#854F0B">via AZ a</text>
  <path d="M928 330 L935 330 L935 217" fill="none" stroke="#BA7517" stroke-width="1.6" marker-end="url(#aa)"/>
  <path d="M831 483 L831 543" fill="none" stroke="#888780" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="839" y="517" font-size="11" fill="#5F5E5A">local route</text>
  <path d="M1077 483 L1077 543" fill="none" stroke="#888780" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="1085" y="517" font-size="11" fill="#5F5E5A">local route</text>
  <path d="M798 720 L680 720 L680 625 L664 625" fill="none" stroke="#888780" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="749" y="712" font-size="11" text-anchor="middle" fill="#5F5E5A">private path</text>
</svg>
